<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社内メール作成ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FBFCEF;
    --paper-2: #EEF5D6;
    --paper-3: #ffffff;
    --ink: #45542F;
    --ink-soft: #8B9A6E;
    --line: #DCE7B4;
    --hanko: #8BC34A;
    --hanko-soft: #EAF3D0;
    --accent: #7CB342;
    --accent-dark: #689F38;
    --accent-soft: #EAF3D0;
    --highlight: #FFE98A;
    --danger: #C77B62;
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "M PLUS Rounded 1c", "Noto Sans JP", sans-serif;
    background:
      radial-gradient(420px 260px at 92% -6%, #E4F2C0 0%, transparent 70%),
      radial-gradient(360px 240px at 8% 108%, #DCEFC4 0%, transparent 70%),
      var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .app{
    display:flex;
    min-height: 100vh;
  }
  /* ---------- Sidebar ---------- */
  .sidebar{
    width: 300px;
    flex-shrink:0;
    background: var(--paper-2);
    border-right: 1px solid var(--line);
    padding: 24px 18px;
    display:flex;
    flex-direction:column;
    gap: 28px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 4px;
  }
  .brand-stamp{
    width:38px;height:38px;border-radius:50%;
    background: linear-gradient(160deg, #DCEFB0, #B9DE86);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    flex-shrink:0;
    box-shadow: inset 0 0 0 2px #fff;
  }
  .brand-text{
    font-family:"M PLUS Rounded 1c", sans-serif;
    font-weight:700;
    font-size: 17px;
    line-height:1.3;
  }
  .brand-sub{
    font-size:11px;
    color: var(--ink-soft);
    letter-spacing: .03em;
  }
  .side-section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .side-title{
    font-size:12px;
    font-weight:700;
    color: var(--ink-soft);
    letter-spacing:.08em;
  }
  .add-btn{
    border:none;
    background:none;
    color: var(--accent);
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    padding:2px 6px;
    border-radius:6px;
  }
  .add-btn:hover{ background: var(--accent-soft); }
  .list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .list-item{
    background: var(--paper-3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition: border-color .15s, transform .1s;
  }
  .list-item:hover{ border-color: var(--accent); }
  .list-item.active{
    border-color: var(--hanko);
    background: var(--hanko-soft);
  }
  .list-item-stamp{
    width:22px;height:22px;border-radius:50%;
    background: var(--hanko-soft);
    font-size:12px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .list-item-main{ flex:1; min-width:0; }
  .list-item-name{
    font-size:13px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .list-item-sub{
    font-size:11px;
    color: var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .list-item-del{
    border:none;background:none;cursor:pointer;
    color: var(--ink-soft);
    font-size:14px;
    padding:2px 4px;
    border-radius:4px;
    flex-shrink:0;
  }
  .list-item-del:hover{ color: var(--danger); background:#FBEDE6; }
  .empty-note{
    font-size:12px;
    color: var(--ink-soft);
    padding: 8px 2px;
    line-height:1.6;
  }
  .field-row{
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .field-row .field{ flex: 1; margin-bottom: 0; }
  .recipient-row{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--paper-3);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 12px;
  }
  .recipient-row input[type=checkbox]{ accent-color: var(--hanko); width:15px; height:15px; flex-shrink:0;}
  .recipient-main{ flex:1; min-width:0; }
  .recipient-name{ font-size:13px; font-weight:500; }
  .recipient-email{ font-size:11px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .recipient-role{ font-size:11px; }
  .recipient-role select{
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 8px;
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-size: 11px;
    background: var(--paper-3);
    color: var(--ink);
    cursor: pointer;
  }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    padding: 34px 44px;
    max-width: 760px;
  }
  .page-head{
    margin-bottom: 26px;
  }
  .page-title{
    font-family:"M PLUS Rounded 1c", sans-serif;
    font-size: 24px;
    font-weight:700;
    margin:0 0 4px;
  }
  .page-desc{
    font-size:13px;
    color: var(--ink-soft);
    margin:0;
  }
  .field{
    margin-bottom: 18px;
  }
  .field-label{
    display:block;
    font-size:12px;
    font-weight:700;
    color: var(--ink-soft);
    letter-spacing:.04em;
    margin-bottom:6px;
  }
  .field-hint{
    font-size:11px;
    color: var(--ink-soft);
    font-weight:400;
    margin-left:6px;
  }
  input[type=text], textarea, select{
    width:100%;
    font-family:"Noto Sans JP", sans-serif;
    font-size:14px;
    color: var(--ink);
    background: var(--paper-3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    outline:none;
  }
  input[type=text]:focus, textarea:focus, select:focus{
    border-color: var(--accent);
  }
  textarea{
    resize: vertical;
    min-height: 220px;
    line-height:1.7;
  }
  .recipient-picker{
    display:flex;
    flex-direction:column;
    gap:6px;
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding:10px;
    background: var(--paper-2);
    max-height:160px;
    overflow-y:auto;
  }
  .recipient-picker .recipient-row{ background: var(--paper-3); }
  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin: 22px 0 8px;
  }
  button.btn{
    font-family:"M PLUS Rounded 1c", sans-serif;
    font-size:13px;
    font-weight:700;
    padding: 11px 18px;
    border-radius: 999px;
    cursor:pointer;
    border: 1.5px solid var(--line);
    background: var(--paper-3);
    color: var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
    transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  button.btn:hover{ border-color: var(--accent); transform: translateY(-1px); }
  button.btn.primary{
    background: var(--accent);
    color:#fff;
    border-color: var(--accent);
    box-shadow: 0 6px 14px rgba(124,179,66,.3);
  }
  button.btn.primary:hover{ background: var(--accent-dark); border-color: var(--accent-dark); }
  button.btn.stamp{
    background: var(--highlight);
    color:#6b5b12;
    border-color: var(--highlight);
    box-shadow: 0 6px 14px rgba(255,233,138,.45);
  }
  button.btn.stamp:hover{ background:#FFE066; border-color:#FFE066; }
  .status-msg{
    font-size:12px;
    color: var(--accent);
    margin-top:6px;
    min-height:16px;
  }
  .save-template-box{
    margin-top: 30px;
    border-top: 1px dashed var(--line);
    padding-top: 18px;
  }
  .save-template-row{
    display:flex;
    gap:10px;
    align-items:center;
  }
  .save-template-row input[type=text]{ flex:1; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background: rgba(36,39,46,.35);
    display:none;
    align-items:center; justify-content:center;
    z-index: 50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background: var(--paper-3);
    border-radius: 22px;
    width: 440px;
    max-width: 92vw;
    max-height: 86vh;
    overflow-y:auto;
    padding: 26px 26px 22px;
    box-shadow: 0 20px 50px rgba(124,179,66,.22);
  }
  .modal-title{
    font-family:"M PLUS Rounded 1c", sans-serif;
    font-size:18px;
    font-weight:700;
    margin: 0 0 18px;
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top: 20px;
  }
  .attachment-list{
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }
  .attachment-item{
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--accent-soft);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-size: 13px;
  }
  .attachment-name{
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--ink);
  }
  .attachment-size{
    font-size: 11px;
    color: var(--ink-soft);
    margin-left: 8px;
    flex-shrink: 0;
  }
  .attachment-remove{
    border: none;
    background: none;
    color: var(--danger);
    cursor: pointer;
    padding: 2px 4px;
    font-size: 14px;
    flex-shrink: 0;
  }
  input[type=file]{ 
    padding: 8px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    background: var(--paper-3);
  }
  .placeholder-tag{
    display:inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    font-size:11px;
    font-weight:700;
    padding:2px 7px;
    border-radius:5px;
    cursor:pointer;
    margin-right:6px;
  }
  @media (max-width: 760px){
    .app{ flex-direction:column; }
    .sidebar{ width:auto; border-right:none; border-bottom:1px solid var(--line); }
    .main{ padding: 24px 20px; max-width:none; }
    .field-row{ flex-direction:column; gap: 12px; }
    .recipient-row{ flex-wrap:wrap; }
    .recipient-role{ width:100%; }
    .recipient-role select{ width:100%; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <div class="sidebar">
    <div class="brand">
      <div class="brand-stamp">🌱</div>
      <div>
        <div class="brand-text">社内メール作成</div>
        <div class="brand-sub">テンプレート & 送信先</div>
      </div>
    </div>

    <div>
      <div class="side-section-head">
        <div class="side-title">テンプレート</div>
        <button class="add-btn" id="btnNewTemplate">＋ 新規</button>
      </div>
      <div class="list" id="templateList"></div>
    </div>

    <div>
      <div class="side-section-head">
        <div class="side-title">送信先</div>
        <button class="add-btn" id="btnNewRecipient">＋ 新規</button>
      </div>
      <div class="list" id="recipientList"></div>
    </div>
  </div>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <div class="page-head">
      <h1 class="page-title">メール作成</h1>
      <p class="page-desc">テンプレートを選ぶと件名・本文・送信先が自動で入ります。日付だけ確認して、コピーまたはGmailで開いてください。</p>
    </div>

    <div class="field">
      <label class="field-label">テンプレートを選択</label>
      <select id="templateSelect">
        <option value="">— 選択してください（または新規作成） —</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label">送信先<span class="field-hint">複数選択できます</span></label>
      <div class="recipient-picker" id="recipientPicker"></div>
    </div>

    <div class="field-row">
      <div class="field">
        <label class="field-label">日付1<span class="field-hint">件名・本文の{{日付1}}</span></label>
        <input type="date" id="mailDate1">
      </div>
      <div class="field">
        <label class="field-label">日付2<span class="field-hint">本文の{{日付2}}</span></label>
        <input type="date" id="mailDate2">
      </div>
      <div class="field">
        <label class="field-label">本文のフォント</label>
        <select id="bodyFont" style="width:100%;">
          <option value="Noto Sans JP">標準（ゴシック）</option>
          <option value="Georgia, serif">セリフ体</option>
          <option value="Courier New, monospace">等幅フォント</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">サイズ</label>
        <select id="bodyFontSize" style="width:100%;">
          <option value="13px">小（13px）</option>
          <option value="14px" selected>標準（14px）</option>
          <option value="15px">大（15px）</option>
          <option value="16px">特大（16px）</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label class="field-label">本文<span class="field-hint">カーソル位置に今日の日付を挿入できます</span></label>
      <textarea id="bodyInput" placeholder="本文を入力、またはテンプレートを選択してください"></textarea>
    </div>

    <div class="field">
      <label class="field-label">署名<span class="field-hint">テンプレートに保存されます</span></label>
      <textarea id="signatureInput" placeholder="例：&#10;ご誘導ください。&#10;営業部 山田太郎&#10;TEL: 090-xxxx-xxxx&#10;Email: yamada@example.co.jp" style="min-height:90px;"></textarea>
    </div>

    <div class="field">
      <label class="field-label">添付ファイル<span class="field-hint">複数ファイル選択可、テンプレートに保存されます</span></label>
      <input type="file" id="attachmentInput" multiple>
      <div class="attachment-list" id="attachmentList"></div>
    </div>

    <div class="toolbar">
      <button class="btn" id="btnInsertDate">📅 今日の日付を挿入</button>
      <button class="btn primary" id="btnCopy">📋 件名+本文をコピー</button>
      <button class="btn stamp" id="btnGmail">✉️ Gmailで開く</button>
      <button class="btn" id="btnSaveDraft">💾 下書きとして保存</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>

    <div class="save-template-box">
      <label class="field-label">このメールをテンプレートとして保存<span class="field-hint">送信先も一緒に保存されます</span></label>
      <div class="save-template-row">
        <input type="text" id="saveTemplateName" placeholder="テンプレート名（例：有給申請）">
        <button class="btn" id="btnSaveAsTemplate">保存</button>
      </div>
    </div>
  </div>

</div>

<!-- ============ Recipient Modal ============ -->
<div class="overlay" id="recipientOverlay">
  <div class="modal">
    <h3 class="modal-title" id="recipientModalTitle">送信先を追加</h3>
    <div class="field">
      <label class="field-label">名前</label>
      <input type="text" id="recipientNameInput" placeholder="例：田中 部長">
    </div>
    <div class="field">
      <label class="field-label">メールアドレス</label>
      <input type="text" id="recipientEmailInput" placeholder="example@company.co.jp">
    </div>
    <div class="modal-actions">
      <button class="btn" id="btnRecipientCancel">キャンセル</button>
      <button class="btn primary" id="btnRecipientSave">保存</button>
    </div>
  </div>
</div>

<!-- ============ Template Modal ============ -->
<div class="overlay" id="templateOverlay">
  <div class="modal">
    <h3 class="modal-title" id="templateModalTitle">テンプレートを新規作成</h3>
    <div class="field">
      <label class="field-label">テンプレート名</label>
      <input type="text" id="tplNameInput" placeholder="例：経費精算書の送付">
    </div>
    <div class="field">
      <label class="field-label">件名</label>
      <input type="text" id="tplSubjectInput" placeholder="【経費精算】{{日付1}}分（山田）">
      <span class="placeholder-tag" data-target="tplSubjectInput" data-tag="{{日付1}}">＋日付1</span>
      <span class="placeholder-tag" data-target="tplSubjectInput" data-tag="{{日付2}}">＋日付2</span>
    </div>
    <div class="field">
      <label class="field-label">本文</label>
      <textarea id="tplBodyInput" style="min-height:160px" placeholder="お疲れ様です。&#10;&#10;{{日付1}}の経費精算書を添付いたします。&#10;ご確認のほどよろしくお願いいたします。"></textarea>
      <span class="placeholder-tag" data-target="tplBodyInput" data-tag="{{日付1}}">＋日付1</span>
      <span class="placeholder-tag" data-target="tplBodyInput" data-tag="{{日付2}}">＋日付2</span>
    </div>
    <div class="field">
      <label class="field-label">署名</label>
      <textarea id="tplSignatureInput" style="min-height:80px" placeholder="ご誘導ください。&#10;営業部 山田太郎&#10;TEL: 090-xxxx-xxxx&#10;申請日: {{日付1}}\"></textarea>
      <span class="placeholder-tag" data-target="tplSignatureInput" data-tag="{{日付1}}">＋日付1</span>
      <span class="placeholder-tag" data-target="tplSignatureInput" data-tag="{{日付2}}">＋日付2</span>
    </div>
    <div class="field">
      <label class="field-label">送信先（このテンプレートで使う相手にチェック）</label>
      <div class="recipient-picker" id="tplRecipientPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="btnTemplateCancel">キャンセル</button>
      <button class="btn primary" id="btnTemplateSave">保存</button>
    </div>
  </div>
</div>

<script>
const DATE_TAG = "{{日付}}";

let templates = [];
let recipients = [];
let selectedRecipientIds = new Set();
let recipientRoles = {}; // { recipientId: 'TO'|'CC'|'BCC' }
let editingTemplateId = null;
let editingRecipientId = null;
let currentAttachments = []; // { name, size, data }
let drafts = []; // メール下書き保存

function setTodayDate(){
  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, '0');
  const day = String(today.getDate()).padStart(2, '0');
  document.getElementById('mailDate1').value = `${year}-${month}-${day}`;
}

function getDateStr(dateInputId){
  const dateInput = document.getElementById(dateInputId).value;
  if(!dateInput) return todayStr();
  const [y, m, d] = dateInput.split('-');
  const dt = new Date(y, m - 1, d);
  const w = ["日","月","火","水","木","金","土"][dt.getDay()];
  return `${y}年${m}月${d}日（${w}）`;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function updateFontSettings(){
  const font = document.getElementById('bodyFont').value;
  const size = document.getElementById('bodyFontSize').value;
  const ta = document.getElementById('bodyInput');
  ta.style.fontFamily = font;
  ta.style.fontSize = size;
}

function todayStr(){
  const d = new Date();
  const w = ["日","月","火","水","木","金","土"][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w}）`;
}

/* 添付ファイル管理 */
function renderAttachmentList(){
  const box = document.getElementById('attachmentList');
  box.innerHTML = '';
  if(currentAttachments.length === 0) return;
  currentAttachments.forEach((att, idx)=>{
    const item = document.createElement('div');
    item.className = 'attachment-item';
    const sizeKB = (att.size / 1024).toFixed(1);
    item.innerHTML = `
      <span class="attachment-name">${escapeHtml(att.name)}</span>
      <span class="attachment-size">${sizeKB} KB</span>
      <button class="attachment-remove" data-idx="${idx}">✕</button>
    `;
    item.querySelector('.attachment-remove').addEventListener('click', ()=>{
      currentAttachments.splice(idx, 1);
      renderAttachmentList();
    });
    box.appendChild(item);
  });
}

document.getElementById('attachmentInput').addEventListener('change', async (e)=>{
  const files = e.target.files;
  for(let file of files){
    const reader = new FileReader();
    reader.onload = (evt)=>{
      const data = evt.target.result;
      currentAttachments.push({
        name: file.name,
        size: file.size,
        data: data // Base64エンコード済み
      });
      renderAttachmentList();
    };
    reader.readAsDataURL(file);
  }
  e.target.value = '';
});


/* このファイルを他の人に配布して、それぞれのブラウザ単体で動かせるように
   保存先はブラウザのlocalStorage（この端末・このブラウザの中だけ）を使用しています。
   ネットやアカウントは不要ですが、データは他の端末とは共有されません。 */
const STORAGE_KEY_TEMPLATES = 'mail_tool_templates';
const STORAGE_KEY_RECIPIENTS = 'mail_tool_recipients';

async function loadData(){
  try{
    const t = localStorage.getItem(STORAGE_KEY_TEMPLATES);
    templates = t ? JSON.parse(t) : [];
  }catch(e){ templates = []; }
  try{
    const r = localStorage.getItem(STORAGE_KEY_RECIPIENTS);
    recipients = r ? JSON.parse(r) : [];
  }catch(e){ recipients = []; }
  renderAll();
}

async function saveTemplates(){
  try{ localStorage.setItem(STORAGE_KEY_TEMPLATES, JSON.stringify(templates)); }
  catch(e){ setStatus('テンプレートの保存に失敗しました（ブラウザの設定をご確認ください）', true); }
}
async function saveRecipients(){
  try{ localStorage.setItem(STORAGE_KEY_RECIPIENTS, JSON.stringify(recipients)); }
  catch(e){ setStatus('送信先の保存に失敗しました（ブラウザの設定をご確認ください）', true); }
}

function setStatus(msg, isErr){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.style.color = isErr ? 'var(--danger)' : 'var(--accent)';
  if(msg){ setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; }, 3200); }
}

/* ---------------- Rendering ---------------- */
function renderAll(){
  renderTemplateList();
  renderTemplateSelect();
  renderRecipientList();
  renderRecipientPicker('recipientPicker', false);
  renderRecipientPicker('tplRecipientPicker', true);
}

function renderTemplateList(){
  const box = document.getElementById('templateList');
  box.innerHTML = '';
  if(templates.length===0){
    box.innerHTML = '<div class="empty-note">まだテンプレートがありません。右下の「保存」から作成できます。</div>';
    return;
  }
  templates.forEach(t=>{
    const row = document.createElement('div');
    row.className = 'list-item';
    row.innerHTML = `
      <div class="list-item-stamp">🌱</div>
      <div class="list-item-main">
        <div class="list-item-name">${escapeHtml(t.name)}</div>
        <div class="list-item-sub">${escapeHtml(t.subject||'')}</div>
      </div>
      <button class="list-item-del" title="削除">✕</button>
    `;
    row.addEventListener('click', (e)=>{
      if(e.target.classList.contains('list-item-del')) return;
      applyTemplate(t.id);
    });
    row.querySelector('.list-item-del').addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(confirm(`テンプレート「${t.name}」を削除しますか？`)){
        templates = templates.filter(x=>x.id!==t.id);
        await saveTemplates();
        renderAll();
      }
    });
    box.appendChild(row);
  });
}

function renderTemplateSelect(){
  const sel = document.getElementById('templateSelect');
  const current = sel.value;
  sel.innerHTML = '<option value="">— 選択してください（または新規作成） —</option>';
  templates.forEach(t=>{
    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = t.name;
    sel.appendChild(opt);
  });
  if(templates.some(t=>t.id===current)) sel.value = current;
}

function renderRecipientList(){
  const box = document.getElementById('recipientList');
  box.innerHTML = '';
  if(recipients.length===0){
    box.innerHTML = '<div class="empty-note">まだ送信先がありません。右上の「＋新規」から追加できます。</div>';
    return;
  }
  recipients.forEach(r=>{
    const row = document.createElement('div');
    row.className = 'list-item';
    row.innerHTML = `
      <div class="list-item-main">
        <div class="list-item-name">${escapeHtml(r.name)}</div>
        <div class="list-item-sub">${escapeHtml(r.email)}</div>
      </div>
      <button class="list-item-del" title="削除">✕</button>
    `;
    row.addEventListener('click', (e)=>{
      if(e.target.classList.contains('list-item-del')) return;
      openRecipientModal(r.id);
    });
    row.querySelector('.list-item-del').addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(confirm(`送信先「${r.name}」を削除しますか？`)){
        recipients = recipients.filter(x=>x.id!==r.id);
        templates.forEach(t=>{ t.recipientIds = (t.recipientIds||[]).filter(id=>id!==r.id); });
        selectedRecipientIds.delete(r.id);
        await saveRecipients();
        await saveTemplates();
        renderAll();
      }
    });
    box.appendChild(row);
  });
}

function renderRecipientPicker(containerId, isTemplateEditor){
  const box = document.getElementById(containerId);
  box.innerHTML = '';
  if(recipients.length===0){
    box.innerHTML = '<div class="empty-note">送信先を先に登録してください。</div>';
    return;
  }
  recipients.forEach(r=>{
    const row = document.createElement('div');
    row.className = 'recipient-row';
    const checked = isTemplateEditor
      ? (tempTplRecipientIds.has(r.id))
      : selectedRecipientIds.has(r.id);
    const role = isTemplateEditor
      ? (tempTplRecipientRoles[r.id] || 'TO')
      : (recipientRoles[r.id] || 'TO');
    
    row.innerHTML = `
      <input type="checkbox" ${checked?'checked':''} data-id="${r.id}">
      <div class="recipient-main">
        <div class="recipient-name">${escapeHtml(r.name)}</div>
        <div class="recipient-email">${escapeHtml(r.email)}</div>
      </div>
      <div class="recipient-role">
        <select data-id="${r.id}">
          <option value="TO" ${role==='TO'?'selected':''}>宛先</option>
          <option value="CC" ${role==='CC'?'selected':''}>CC</option>
          <option value="BCC" ${role==='BCC'?'selected':''}>BCC</option>
        </select>
      </div>
    `;
    const checkbox = row.querySelector('input[type=checkbox]');
    const roleSelect = row.querySelector('select');
    
    checkbox.addEventListener('change', (e)=>{
      const id = r.id;
      const set = isTemplateEditor ? tempTplRecipientIds : selectedRecipientIds;
      if(e.target.checked) set.add(id); else set.delete(id);
    });
    
    roleSelect.addEventListener('change', (e)=>{
      const map = isTemplateEditor ? tempTplRecipientRoles : recipientRoles;
      map[r.id] = e.target.value;
    });
    
    box.appendChild(row);
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- Compose actions ---------------- */
function applyTemplate(id){
  const t = templates.find(x=>x.id===id);
  if(!t) return;
  const date1 = getDateStr('mailDate1');
  const date2 = getDateStr('mailDate2');
  document.getElementById('templateSelect').value = id;
  let subject = (t.subject||'');
  let body = (t.body||'');
  let signature = (t.signature||'');
  // 複数日付対応
  subject = subject.split('{{日付1}}').join(date1).split('{{日付2}}').join(date2);
  body = body.split('{{日付1}}').join(date1).split('{{日付2}}').join(date2);
  signature = signature.split('{{日付1}}').join(date1).split('{{日付2}}').join(date2);
  document.getElementById('subjectInput').value = subject;
  document.getElementById('bodyInput').value = body;
  document.getElementById('signatureInput').value = signature;
  selectedRecipientIds = new Set(t.recipientIds||[]);
  recipientRoles = t.recipientRoles ? {...t.recipientRoles} : {};
  currentAttachments = t.attachments ? JSON.parse(JSON.stringify(t.attachments)) : [];
  renderAttachmentList();
  updateFontSettings();
  renderRecipientPicker('recipientPicker', false);
  renderTemplateList();
  document.querySelectorAll('#templateList .list-item').forEach((el,i)=>{
    el.classList.toggle('active', templates[i] && templates[i].id===id);
  });
}

document.getElementById('templateSelect').addEventListener('change', (e)=>{
  if(e.target.value) applyTemplate(e.target.value);
});

document.getElementById('btnSaveDraft').addEventListener('click', async ()=>{
  const subject = document.getElementById('subjectInput').value;
  const body = document.getElementById('bodyInput').value;
  const signature = document.getElementById('signatureInput').value;
  const toEmails = recipients.filter(r=>selectedRecipientIds.has(r.id) && (recipientRoles[r.id] || 'TO')==='TO').map(r=>r.email).join(',');
  const ccEmails = recipients.filter(r=>selectedRecipientIds.has(r.id) && recipientRoles[r.id]==='CC').map(r=>r.email).join(',');
  const bccEmails = recipients.filter(r=>selectedRecipientIds.has(r.id) && recipientRoles[r.id]==='BCC').map(r=>r.email).join(',');
  const fullBody = signature ? `${body}\n\n${signature}` : body;
  
  const draft = {
    id: uid(),
    subject,
    to: toEmails,
    cc: ccEmails,
    bcc: bccEmails,
    body: fullBody,
    attachments: JSON.parse(JSON.stringify(currentAttachments)),
    savedAt: new Date().toLocaleString('ja-JP')
  };
  
  drafts.push(draft);
  localStorage.setItem('mail_tool_drafts', JSON.stringify(drafts));
  
  // Gmail API互換形式でGmailに送信を試みる
  let url = `https://mail.google.com/mail/?view=cm&fs=1`;
  if(toEmails) url += `&to=${encodeURIComponent(toEmails)}`;
  if(ccEmails) url += `&cc=${encodeURIComponent(ccEmails)}`;
  if(bccEmails) url += `&bcc=${encodeURIComponent(bccEmails)}`;
  url += `&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(fullBody)}`;
  window.open(url, '_blank');
  
  setStatus(`下書きをGmailで開き、ローカルにも保存しました（${draft.savedAt}）`);
});

document.getElementById('btnInsertDate').addEventListener('click', ()=>{
  const ta = document.getElementById('bodyInput');
  const pos = ta.selectionStart ?? ta.value.length;
  const text = ta.value;
  const date = getDateStr('mailDate1');
  ta.value = text.slice(0,pos) + date + text.slice(pos);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = pos + date.length;
});

document.getElementById('btnCopy').addEventListener('click', async ()=>{
  const subject = document.getElementById('subjectInput').value;
  const body = document.getElementById('bodyInput').value;
  const signature = document.getElementById('signatureInput').value;
  const fullBody = signature ? `${body}\n\n${signature}` : body;
  const text = `件名：${subject}\n\n${fullBody}`;
  try{
    await navigator.clipboard.writeText(text);
    setStatus('件名と本文（署名付き）をコピーしました。Gmailに貼り付けてください。');
  }catch(e){
    setStatus('コピーに失敗しました。手動で選択してコピーしてください。', true);
  }
});

document.getElementById('btnGmail').addEventListener('click', ()=>{
  const subject = document.getElementById('subjectInput').value;
  const body = document.getElementById('bodyInput').value;
  const signature = document.getElementById('signatureInput').value;
  const fullBody = signature ? `${body}\n\n${signature}` : body;
  
  // TO、CC、BCCを役割に応じて分ける
  const toEmails = recipients.filter(r=>selectedRecipientIds.has(r.id) && (recipientRoles[r.id] || 'TO')==='TO').map(r=>r.email).join(',');
  const ccEmails = recipients.filter(r=>selectedRecipientIds.has(r.id) && recipientRoles[r.id]==='CC').map(r=>r.email).join(',');
  const bccEmails = recipients.filter(r=>selectedRecipientIds.has(r.id) && recipientRoles[r.id]==='BCC').map(r=>r.email).join(',');
  
  let url = `https://mail.google.com/mail/?view=cm&fs=1`;
  if(toEmails) url += `&to=${encodeURIComponent(toEmails)}`;
  if(ccEmails) url += `&cc=${encodeURIComponent(ccEmails)}`;
  if(bccEmails) url += `&bcc=${encodeURIComponent(bccEmails)}`;
  url += `&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(fullBody)}`;
  
  window.open(url, '_blank');
});

document.getElementById('btnSaveAsTemplate').addEventListener('click', async ()=>{
  const nameInput = document.getElementById('saveTemplateName');
  const name = nameInput.value.trim();
  if(!name){ setStatus('テンプレート名を入力してください', true); return; }
  const subject = document.getElementById('subjectInput').value;
  const body = document.getElementById('bodyInput').value;
  const signature = document.getElementById('signatureInput').value;
  templates.push({
    id: uid(),
    name,
    subject,
    body,
    signature,
    recipientIds: Array.from(selectedRecipientIds),
    recipientRoles: {...recipientRoles},
    attachments: JSON.parse(JSON.stringify(currentAttachments))
  });
  await saveTemplates();
  nameInput.value = '';
  renderTemplateList();
  renderTemplateSelect();
  setStatus(`テンプレート「${name}」を保存しました`);
});

/* ---------------- Recipient modal ---------------- */
const recipientOverlay = document.getElementById('recipientOverlay');
function openRecipientModal(id){
  console.log('openRecipientModal called with id:', id);
  console.log('recipientOverlay:', recipientOverlay);
  editingRecipientId = id || null;
  const r = id ? recipients.find(x=>x.id===id) : null;

  document.getElementById('recipientNameInput').value = r ? r.name : '';
  document.getElementById('recipientEmailInput').value = r ? r.email : '';

}
document.getElementById('btnNewRecipient').addEventListener('click', ()=>{
  console.log('btnNewRecipient clicked');
  openRecipientModal(null);
});
document.getElementById('btnRecipientCancel').addEventListener('click', ()=>recipientOverlay.classList.remove('open'));
document.getElementById('btnRecipientSave').addEventListener('click', async ()=>{
  const name = document.getElementById('recipientNameInput').value.trim();
  const email = document.getElementById('recipientEmailInput').value.trim();
  if(!name || !email){ alert('名前とメールアドレスを入力してください'); return; }
  if(editingRecipientId){
    const r = recipients.find(x=>x.id===editingRecipientId);
    r.name = name; r.email = email;
  }else{
    recipients.push({ id: uid(), name, email });
  }
  await saveRecipients();
  recipientOverlay.classList.remove('open');
  renderAll();
});

/* ---------------- Template modal ---------------- */
const templateOverlay = document.getElementById('templateOverlay');
let tempTplRecipientIds = new Set();
let tempTplRecipientRoles = {};
function openTemplateModal(id){
  console.log('openTemplateModal called with id:', id);
  console.log('templateOverlay:', templateOverlay);
  editingTemplateId = id || null;
  const t = id ? templates.find(x=>x.id===id) : null;
  tempTplRecipientIds = new Set(t ? (t.recipientIds||[]) : []);
  tempTplRecipientRoles = t && t.recipientRoles ? {...t.recipientRoles} : {};
  document.getElementById('templateModalTitle').textContent = id ? 'テンプレートを編集' : 'テンプレートを新規作成';
  document.getElementById('tplNameInput').value = t ? t.name : '';
  document.getElementById('tplSubjectInput').value = t ? t.subject : '';
  document.getElementById('tplBodyInput').value = t ? t.body : '';
  document.getElementById('tplSignatureInput').value = t ? t.signature : '';
  renderRecipientPicker('tplRecipientPicker', true);
  templateOverlay.classList.add('open');
  console.log('Template Modal should now be visible');
}
document.getElementById('btnNewTemplate').addEventListener('click', ()=>{
  console.log('btnNewTemplate clicked');
  openTemplateModal(null);
});
document.getElementById('btnTemplateCancel').addEventListener('click', ()=>templateOverlay.classList.remove('open'));
document.getElementById('btnTemplateSave').addEventListener('click', async ()=>{

  const body = document.getElementById('tplBodyInput').value;

  renderAll();
});
